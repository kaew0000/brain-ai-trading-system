name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff vulture
      - run: ruff check . --exclude dashboard_src --exclude dashboard
      - run: vulture . --exclude dashboard_src,dashboard,tests --min-confidence 80

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Track W14-1 (PR #53) added tests/test_dashboard_serving.py, which
      # asserts against the real Vite build output at dashboard_src/dist/
      # (see that file's module docstring). dist/ is gitignored, so it
      # only exists if this job builds it first — without this step those
      # tests fail on every clean checkout, CI included.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard_src/package-lock.json
      - name: Build dashboard_src (required by tests/test_dashboard_serving.py)
        run: |
          cd dashboard_src
          npm ci
          npm run build
      - run: pip install -r requirements.txt
      - run: pip install pytest-cov
      - run: pytest tests/ -q --cov=. --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  world-tests:
    # Phase W13-CI-1: world/tests/ is outside pytest.ini's `testpaths`
    # and almost none of its files carry the `unit` marker that
    # `addopts = -m "unit"` filters on, so the marker-based invocation
    # the `test` job uses above would silently select zero tests here.
    # `-m ""` overrides that filter for this job only — pytest.ini and
    # the `test` job's behavior for tests/ are both left untouched.
    # pytest exits non-zero when a run collects zero tests, so a
    # future regression back to "0 selected" fails this job rather
    # than reporting a silent green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest world/tests/ -q -m ""

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip install -r requirements.txt
      - run: pip-audit || true   # advisory only, does not block CI yet
